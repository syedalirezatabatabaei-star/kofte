<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="صفحه فارسی با منوی اصلی و بخش محتوای کناری">
  <link rel="stylesheet" href="./css/main.css">
  <title>صفحه اصلی</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>به نام خداوند بخشنده مهربان</h1>
    </header>

    <nav class="main-nav" aria-label="منوی اصلی سایت">
      <a href="#home">صفحه اصلی</a>
      <a href="#contact">تماس با ما</a>
      <a href="#about">درباره ما</a>
    </nav>

    <main class="layout" id="home">
      <section class="content" aria-labelledby="menu-title">
        <h2 id="menu-title">منو اصلی</h2>
        <nav class="panel-nav" aria-label="ناوبری بخش اصلی">
          <a href="#content-1">محتوا ۱</a>
          <a href="#content-2">محتوا ۲</a>
          <a href="#content-3">محتوا ۳</a>
        </nav>
      </section>

      <aside class="sidebar" aria-labelledby="content-title">
        <h2 id="content-title">محتوا</h2>

        <section class="content-item" id="content-1">
          <h3>محتوا ۱</h3>
        </section>

        <section class="content-item" id="content-2">
          <h3>محتوا ۲</h3>
        </section>

        <section class="content-item" id="content-3">
          <h3>محتوا ۳</h3>
        </section>

        <div class="section-links">
          <a id="about" href="#home">درباره ما</a>
          <a id="contact" href="mailto:info@example.com">تماس با ما</a>
        </div>
      </aside>
    </main>

    <footer>فناوری ره‌آورد رایان تینا</footer>
  </div>
</body>
</html>
